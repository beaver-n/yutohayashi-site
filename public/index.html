<style>
/* Layout: 白い紙に黒い文字だけ。最初は中央にあいさつ、会話が始まるとその下にログが伸びる。わざと白一色のデザイン。 */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#777777; --line:#e4e4e4; --soft:#f4f4f4;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.col{max-width:680px;margin:0 auto;padding-inline:20px}
.small{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--muted)}

.top{position:fixed;top:env(safe-area-inset-top,0px);right:0;z-index:5;padding:14px 20px}
.top button{border:0;padding:4px 0;font-size:.82rem;color:var(--muted);text-decoration:underline;text-underline-offset:4px}
.top button:hover{color:var(--fg)}

/* hello */
.hello{min-height:calc(100vh - 170px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:32px;padding-block:24px}
@supports (height:100svh){.hello{min-height:calc(100svh - 170px)}}
body.talking .hello{min-height:0;padding-block:70px 56px}
.hello h1{font-weight:700;font-size:clamp(1.7rem,6.4vw,2.8rem);line-height:1.35;margin:0;letter-spacing:.02em;text-wrap:balance}
/* タイピング:文字は最初から場所を取っていて、見えるようになるだけ(レイアウトが動かない) */
.ch{opacity:0}
.ch.on{opacity:1}
.cur{position:relative}
.cur::after{content:"";position:absolute;left:100%;top:50%;width:2px;height:1em;margin-left:2px;transform:translateY(-50%);background:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* log */
.log{display:flex;flex-direction:column;gap:28px;padding-bottom:220px}
.msg.ai{display:flex;flex-direction:column;gap:12px;min-width:0}
.msg.ai p{margin:0}
.msg.user{display:flex;justify-content:flex-end}
.msg.user span{background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:18px;max-width:80%;font-size:.95rem;line-height:1.6}
.dots{display:flex;gap:5px;padding:8px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:fade 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes fade{50%{opacity:.2}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hello .chips{justify-content:center}
.chip{border:1px solid var(--fg);border-radius:999px;padding:6px 16px;font-size:.88rem;line-height:1.5;background:var(--bg)}
.chip:hover{background:var(--fg);color:var(--bg)}

/* work list */
.works{display:grid;border-top:1px solid var(--line)}
.works button{display:flex;justify-content:space-between;align-items:baseline;gap:16px;text-align:left;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.works button b{font-weight:700}
.works button:hover b{text-decoration:underline;text-underline-offset:4px}

/* detail */
.detail{border-top:2px solid var(--fg);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.detail img{width:100%;max-width:100%;border-radius:6px;display:block;background:var(--soft);border:1px solid var(--line)}
.detail h3{font-size:1.3rem;margin:0;line-height:1.4}
.detail p{margin:0}
/* ===== 作品の「くわしく」:横スワイプ(Appleの製品ページ風) ===== */
.story{display:grid;gap:14px;margin-top:6px}
.st-view{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;outline:none;overscroll-behavior-x:contain}
.st-view::-webkit-scrollbar{display:none}
.st-view.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.st-view:focus-visible{outline:2px solid var(--fg);outline-offset:4px;border-radius:20px}
.st-slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex}
.st-media{aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.st-media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.st-media.type{background:var(--fg);color:var(--bg);border-color:var(--fg);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:22px 24px}
.st-media.type span{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.14em;opacity:.6}
.st-media.type b{font-size:clamp(1.4rem,4.6vw,2rem);line-height:1.3}
.st-cap{margin:0;flex:1;background:var(--soft);border-radius:24px;padding:20px 24px;font-size:.98rem;line-height:1.8;user-select:none}
.st-bar{display:flex;justify-content:space-between;align-items:center}
.st-dots{display:flex;gap:6px}
.st-dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .3s,background .3s}
.st-dots i.on{width:18px;background:var(--fg)}
.st-navs{display:flex;gap:8px}
.st-nav{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:1.4rem;line-height:1;display:grid;place-items:center;transition:opacity .2s,background .2s}
.st-nav:hover:not(:disabled){background:var(--line)}
.st-nav:disabled{opacity:.3;cursor:default}
.story{text-align:left}
.story.one .st-bar{display:none}
.st-viewer{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#fff}
.st-viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.22,.61,.36,1);pointer-events:none}
.st-vlab{position:absolute;left:12px;bottom:12px;background:rgba(17,17,17,.82);color:#fff;font-size:.78rem;padding:4px 12px;border-radius:999px;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.st-vlab.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.st-viewer img{transition:none}}
.st-cap b{margin-right:.6em}
.story.one .st-slide{flex-basis:100%}
@media (min-width:700px){
}
.badge{font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--fg);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.embed{position:relative;width:100%;max-width:100%;aspect-ratio:16/11;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.embed span{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* 写真を押せる作品:カーソルをのせると少し浮く */
.shot{position:relative;display:block;border-radius:6px;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s ease}
.shot img{border-radius:6px}
/* すみの「↗」:浮いたときにふわっと出る */
.shot .go{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--fg);color:var(--bg);font-size:.95rem;font-weight:700;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.2);
  opacity:0;transform:translateY(4px);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.shot:hover .go,.shot:focus-visible .go{opacity:1;transform:none}
@media (hover:none){.shot .go{opacity:1;transform:none}}
@media (hover:hover){.shot:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(0,0,0,.14),0 4px 8px rgba(0,0,0,.08)}}
.shot:active{transform:translateY(-2px) scale(.99);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.shot:focus-visible{transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.shot{transition:box-shadow .2s}.shot:hover,.shot:active,.shot:focus-visible{transform:none}}
.golink{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--fg);border-radius:999px;padding:7px 18px;font-size:.88rem;font-weight:700;text-decoration:none;margin-top:4px}
.golink:hover{background:var(--fg);color:var(--bg)}
.tags span{font-family:var(--f-mono);font-size:.72rem;background:var(--soft);padding:2px 9px;border-radius:3px}

.rows{display:grid;border-top:1px solid var(--line)}
.rows > *{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.rows span{color:var(--muted);font-size:.88rem;text-align:right;min-width:0;overflow-wrap:anywhere}
.rows b{flex:none;white-space:nowrap}
a.row:hover b{text-decoration:underline;text-underline-offset:4px}

/* composer */
#f{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(to top,var(--bg) 75%,rgba(255,255,255,0))}
#f .col{padding-block:22px 16px;display:flex;flex-direction:column;gap:10px}
.dock .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px;-webkit-overflow-scrolling:touch}
.dock .chips::-webkit-scrollbar{display:none}
.dock .chip{flex:none;white-space:nowrap}
.dock .chip.next{background:var(--fg);color:var(--bg)}
/* PC:ボタンを横一列に(入りきらないときは横スクロール) */
@media (min-width:700px){
  .col{max-width:840px}
  .chip .sp{display:none}
  .dock .chips{flex-wrap:nowrap;margin-inline:0;padding-inline:0}
  /* PCは真ん中ぞろえ */
  .dock .chips{justify-content:center}
  /* ボタンが多いときも切れないように:列より広く使って、それでも入らなければ2段にする */
  #f .dock{width:min(calc(100vw - 48px),1120px);align-self:center}
  .dock .chips{flex-wrap:wrap;overflow:visible;row-gap:8px}
  /* PCだけ:あいさつと作品のホイールのあいだを広げる */
  .hello .start{margin-top:36px}
  .msg.ai{align-items:center;text-align:center}
  .msg.ai > p{max-width:42em;text-wrap:balance}
  .msg.ai > .works,.msg.ai > .rows,.msg.ai > .detail{width:100%;text-align:left}
  .msg.ai > .rows{max-width:560px}
  .pick{width:100%;max-width:640px;grid-template-columns:1fr 1fr}
  .pick .opt{text-align:left}
  .pick .copy{grid-column:1/-1;justify-self:center}
}

/* 隠し画面:パスワード */
.lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;opacity:0;transition:opacity .4s ease}
.lock.open{opacity:1}
.lock .in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.lock h2{margin:0;font-size:clamp(1.3rem,5vw,1.7rem);line-height:1.4}
.lock p{margin:0;color:var(--muted);font-size:.92rem;text-wrap:balance}
.lock .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;border:0;font-size:1.6rem;line-height:1;padding:8px;color:var(--muted)}
.pin{position:relative;display:flex;gap:12px;margin-top:6px}
.pin span{width:54px;height:64px;border:1.5px solid var(--fg);border-radius:12px;display:grid;place-items:center;font-size:1.7rem;font-weight:700;font-family:var(--f-mono)}
.pin span.now{box-shadow:0 0 0 3px rgba(17,17,17,.12)}
.pin input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;caret-color:transparent}
.pin.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock .msg1{font-size:clamp(1.4rem,6vw,2rem);font-weight:700;color:var(--fg);margin:0}
.lock .msg2{opacity:0;transform:translateY(8px);transition:opacity .9s ease,transform .9s ease;color:var(--fg);font-size:1rem}
.lock .msg2.show{opacity:1;transform:none}
.lock .back{border:1px solid var(--fg);border-radius:999px;padding:8px 22px;margin-top:8px}
@media (prefers-reduced-motion:reduce){.lock,.lock .msg2{transition:none}.pin.bad{animation:none}}

/* ===== 迷子のおしらせパレード(ゲーム画面は夜のパークなので、あえて暗い色で固定) ===== */
/* 5秒かくれて → ふわっと出て3秒見える → ふわっと消える、をくり返す
   (場所はあけたままなので一覧がずれない) */
.works .ev{animation:peek 8s ease-in-out infinite}
.works .ev b{letter-spacing:.02em}
.works.evrow{border-top:0;width:100%;max-width:560px}
.works.evrow .ev{border-bottom:0;justify-content:center;gap:12px}
@keyframes peek{
  0%,62.5%    {opacity:0;visibility:hidden}
  62.6%       {opacity:0;visibility:visible}
  68.75%,93.75%{opacity:1;visibility:visible}
  99.9%       {opacity:0;visibility:visible}
  100%        {opacity:0;visibility:hidden}
}


.parade{--n-sky:#0b1024;--n-sky2:#1b1f45;--n-ground:#151628;--n-fg:#f4efe2;--n-dim:#a9a7c4;--n-gold:#ffd27a;--n-ok:#7dffb0;--n-bad:#ff7a7a;
  position:fixed;inset:0;z-index:1000;color:var(--n-fg);overflow:hidden;font-family:var(--f-body);touch-action:manipulation;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 32% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 14%,#fff,transparent),
    radial-gradient(1px 1px at 78% 6%,#fff,transparent),radial-gradient(1px 1px at 90% 22%,#fff,transparent),radial-gradient(1px 1px at 44% 26%,#fff,transparent),
    linear-gradient(to bottom,var(--n-sky) 0%,var(--n-sky2) 48%,var(--n-ground) 48.2%,#0d0e1c 100%)}
.parade::before{content:"";position:absolute;left:-5%;right:-5%;top:calc(env(safe-area-inset-top,0px) + 54px);height:26px;pointer-events:none;
  background:radial-gradient(circle at 50% 30%,var(--n-gold) 0 3px,rgba(255,210,122,.25) 4px 7px,transparent 8px) 0 0/34px 26px repeat-x;opacity:.9}
.pd-top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;z-index:8}
.pd-top .rd{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;color:var(--n-dim);min-width:4.5em}
.pd-timer{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;visibility:hidden}
.pd-timer i{display:block;height:100%;width:100%;background:var(--n-gold);transform-origin:left center}
.pd-x{border:0;color:var(--n-fg);font-size:1.6rem;line-height:1;padding:6px 8px;background:none}
.pd-banner{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 92px);text-align:center;z-index:4;font-weight:700;font-size:clamp(1.05rem,4.4vw,1.4rem);text-shadow:0 2px 12px rgba(0,0,0,.6);padding-inline:16px}
.pd-banner small{display:block;font-weight:400;font-size:.8rem;color:var(--n-dim);margin-top:2px}
.pd-float{position:absolute;left:50%;bottom:7%;width:min(80vw,44vh,400px);margin-left:calc(min(80vw,44vh,400px) / -2);z-index:3;transform:translateX(120vw);will-change:transform;pointer-events:none}
.pd-float img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.pd-led{position:absolute;left:38.5%;top:28.6%;width:32.8%;height:25.6%;background:#030405;overflow:hidden}
.pd-led canvas{width:100%;height:100%;display:block;image-rendering:pixelated;filter:saturate(1.4) brightness(1.25)}
.pd-led::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.7) 62%) 0 0/5px 5px;pointer-events:none}
.pd-crowd{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 120px);bottom:16px;z-index:2}
.pd-p{position:absolute;border:0;padding:0;background:none;transform-origin:50% 100%;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.pd-p svg{display:block;width:100%;height:auto;overflow:visible}
.pd-p.no{animation:no .4s;opacity:.35}
.pd-p.hit{z-index:99;animation:hit .9s ease both}
.pd-p.hit::after,.pd-p.show::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;bottom:-6%;border-radius:50%;box-shadow:0 0 0 3px var(--n-ok),0 0 24px var(--n-ok);pointer-events:none}
.pd-p.show::after{box-shadow:0 0 0 3px var(--n-gold),0 0 24px var(--n-gold)}
.pd-crowd.cheer .pd-p{animation:jump .5s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes hit{40%{transform:translateY(-14px) scale(1.15)}100%{transform:scale(1.15)}}
@keyframes jump{to{transform:translateY(-8px)}}
.pd-card{position:absolute;inset:0;z-index:6;background:rgba(9,12,30,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px 20px}
.pd-card h2{margin:0;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.3;text-wrap:balance;text-shadow:0 0 18px rgba(255,210,122,.35)}
.pd-card p{margin:0;color:var(--n-dim);max-width:26em;text-wrap:balance;line-height:1.7}
.pd-card .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pd-btn{border:1.5px solid var(--n-fg);color:var(--n-fg);background:none;border-radius:999px;padding:10px 26px;font-weight:700;min-height:44px}
.pd-btn.main{background:var(--n-gold);border-color:var(--n-gold);color:#1a1405}
.pd-toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.65);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.pd-toast.on{opacity:1}
.pd-fx{position:absolute;inset:0;z-index:5;pointer-events:none}

/* photo */
.photo{margin:0;width:100%;max-width:420px;border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:3/4}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* contact choice */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}

"], ["企画とプレゼン", "伝わるスライドと発表"], ["音楽", "ギター・ピアノ"]], "en": [["Experience design", "Planning immersive experiences and events"], ["Web", "HTML / CSS / JS, tools built with AI"], ["Film", "Reporting, shooting, story structure"], ["Planning & pitching", "Clear slides and presentations"], ["Music", "Guitar, piano"]]}, "works": [{"id": "veil", "short": "SNS風の画面で手がかりを追う、物語に入りこむWeb体験", "title": "体験型コンテンツ制作", "kind": "Webサイト", "role": "企画・設計・開発", "text": "遊ぶ人が物語の中に入りこめる、体験型のWebサイトをつくっています。代表作の「WIRE」は、SNS風の画面の中で手がかりを追い、謎を解いていくミステリーゲームです。遊ぶ人自身が物語の登場人物になるように設計しました。", "tags": ["体験設計", "ゲームデザイン", "HTML / CSS / JS"], "en": {"title": "Interactive Content", "kind": "Website", "role": "Concept, design, development", "short": "A story-driven web experience where you chase clues on an SNS-style screen", "text": "I create interactive websites that pull players into the story. My main work, “WIRE,” is a mystery game where you follow clues and solve puzzles inside an SNS-style screen. I designed it so the players themselves become characters in the story.", "tags": ["Experience design", "Game design", "HTML / CSS / JS"]}}, {"id": "qunasys", "thumb": "/img/qunasys.jpg", "short": "2050年に欲しいガジェットを提案し、チームで優勝", "embed": "https://drive.google.com/file/d/1TQ0p3JSMcVXY9-oSvXW2Y-wcrZzWjYHH/preview", "title": "未来のガジェット提案", "kind": "企画", "role": "スライド制作", "badge": "優勝", "text": "N高×QunaSysの課外活動で、「2050年に欲しいガジェット」というお題に対してチームで話し合い、発表して、優勝しました。私は、提案が伝わるスライドの構成とデザインを担当しました。", "tags": ["企画", "プレゼン", "QunaSys"], "en": {"title": "Future Gadget Proposal", "kind": "Concept", "role": "Slide design", "badge": "Winner", "short": "Proposed a gadget we want in 2050 — and our team won", "text": "In an extracurricular program by N High School and QunaSys, a quantum computing company, our team discussed the theme “a gadget we want in 2050,” presented our idea, and won first place. I was in charge of the structure and design of the slides that made our idea clear.", "tags": ["Planning", "Presentation", "QunaSys"]}}, {"id": "film", "thumb": "/img/film.jpg", "short": "大阪・梅田の炊き出しを取材したドキュメンタリー", "embed": "https://drive.google.com/file/d/14LJP7L59HrLr5RDfpwHdPMHBZA5R-xhc/preview", "title": "フードロス・ドキュメンタリー", "kind": "映像", "role": "カメラ", "text": "N高×LINEヤフーの課外活動で、ドキュメンタリーを制作しました。私の班ではフードロスを題材にして、私は母校と、梅田の炊き出しの現場に行って取材しました。カメラマンとして、映像の画づくりと構成も担当しました。", "tags": ["映像制作", "取材", "LINEヤフー"], "en": {"title": "Food Loss Documentary", "kind": "Film", "role": "Camera", "short": "A documentary about a community food handout in Umeda, Osaka", "text": "In an extracurricular program by N High School and LINE Yahoo, we made a documentary. My group chose food loss as our theme, and I went to my former school and to a community food handout in Umeda, Osaka, to report. As the camera operator, I also handled the look of the shots and the structure of the film.", "tags": ["Filmmaking", "Reporting", "LINE Yahoo"]}}, {"id": "memoru", "short": "雑に取ったメモを、AIが整理してくれるWebアプリ", "link": "https://tangerine-zuccutto-6a1789.netlify.app/", "title": "メモるくん", "kind": "Webアプリ", "role": "企画・開発", "img": "/img/memoru.jpg", "text": "話を聞きながら雑にメモを取り、終わったらボタン一つでAIが整理してくれるWebアプリです。PREP法での入力、手書き、音声入力に対応しています。4桁のルーム番号をそろえれば、みんなで同じメモをその場で共有することもできます。", "tags": ["Gemini API", "音声入力", "リアルタイム共有", "HTML / CSS / JS"], "en": {"title": "Memoru-kun", "kind": "Web app", "role": "Concept, development", "short": "A web app where AI tidies up your messy notes", "text": "Jot down rough notes while you listen, then tap one button and AI organizes them for you. It supports PREP-style input, handwriting, and voice input. Enter the same 4-digit room number, and everyone can share the same notes in real time.", "tags": ["Gemini API", "Voice input", "Real-time sharing", "HTML / CSS / JS"]}, "story": {"ja": [{"h": "使っている技術", "p": "AIの部分には、GoogleのGemini APIを使っています。"}], "en": [{"h": "Under the hood", "p": "The AI part uses Google’s Gemini API."}]}}, {"id": "ybe", "short": "「ビーバーの世界のインターネット」をつくったポータルサイト", "link": "https://timely-kitsune-a54a99.netlify.app/", "title": "YBe! JAPAN", "kind": "世界観づくり", "role": "企画・デザイン・開発", "img": "/img/ybe.jpg", "text": "ニックネームの「ビーバー」にちなんで、ビーバーの世界はどんなものなのか、ビーバーの世界では何が使われているのかを、人間にも体験してもらおう、という設定でつくったポータルサイトです。ニュース、天気、占いまで揃えて、架空の世界を本物のサービスのように見せています。", "tags": ["世界観設計", "Webデザイン"], "en": {"title": "YBe! JAPAN", "kind": "Worldbuilding", "role": "Concept, design, development", "short": "A portal site for “the internet in a world of beavers”", "text": "Inspired by my nickname, “Beaver,” I built this portal site around one idea: let humans experience what the world of beavers is like, and what beavers use there. With news, weather, and even horoscopes, it makes a made-up world look like a real online service.", "tags": ["Worldbuilding", "Web design"]}, "story": {"ja": [{"h": "ビーバーの世界の道具", "p": "ビーバーの世界では、何が使われているのか。その答えとして、ビーバーのためのインターネットをつくりました。"}, {"h": "一番の自信作", "p": "このポートフォリオの中で、一番自信のある作品です。"}], "en": [{"h": "Tools of the beaver world", "p": "What do beavers use in their world? My answer: an internet made just for beavers."}, {"h": "My proudest work", "p": "Of everything in this portfolio, this is the one I’m most proud of."}]}}], "future": [{"id": "park", "img": "/img/park.webp", "viewer": true, "title": "将来つくりたいテーマパーク", "kind": "テーマパーク構想", "role": "構想", "short": "いつか、こんなテーマパークをつくりたい", "text": "いつか、こんなテーマパークをつくりたいと思っています。これは、私が考えている将来のパークを、AIでつくった構想イメージです。", "tags": ["テーマパーク", "構想イメージ(AI)"], "en": {"title": "The Theme Park I Want to Build", "kind": "Theme park concept", "role": "Concept", "short": "Someday, I want to build a theme park like this", "text": "Someday, I want to build a theme park like this. This is an AI-generated concept image of the park I imagine for the future.", "tags": ["Theme park", "Concept image (AI)"]}, "story": {"ja": [{"z": {"x": 0.5, "y": 0.43, "s": 2.6}, "h": "最大の魅力「360° Island」", "p": "パークの真ん中にうかぶ島「360° Island」が、このパークの象徴です。地下の入り口とショップをぬけた先にあります。ディズニーでいう、シンデレラ城のような存在です。"}, {"z": {"x": 0.5, "y": 0.43, "s": 1.5}, "h": "なぜ360°なのか", "p": "シンデレラ城は、どれだけ感動しても、最初に目に入る角度は180°です。でも360° Islandからは、パークを360°ぐるっと一望できます。見る方角によって、それぞれテーマがちがいます。各エリアとこの島は、歩道橋でつながっています。"}, {"z": {"x": 0.25, "y": 0.25, "s": 2}, "h": "仮想の街(スペイン風)", "p": "スペイン風の仮想の街です。ここにしかない、仮想のエリアです。"}, {"z": {"x": 0.25, "y": 0.75, "s": 2}, "h": "スペインエリア", "p": "実際にあるスペインの街を再現したエリアです。ここでは、みんなでいっしょにラテン音楽を演奏したり、ダークライド「ドン・キホーテと風車の巨人」に乗ったりできます。このライドでは、物語の世界を旅するうちに、風車が本当に巨人に見えてきます。"}, {"z": {"x": 0.75, "y": 0.75, "s": 2}, "h": "ラスベガスエリア", "p": "実際にあるラスベガスの街を再現したエリアです。360° Islandから見ると、華やかなラスベガスの街。でも一歩、裏へ足をふみ入れると、想像を絶する景色が広がっています。そこには、地球外生命体を研究する施設「エリア51」や、謎の犯罪組織のアジトも。あなたは、この街から逃れることができるのか――。"}, {"z": {"x": 0.75, "y": 0.25, "s": 2}, "h": "アメリカンキッズワールド", "p": "華やかなカーニバルの街へようこそ！この街では、子どもが主役。そしてこのエリアに入った全員が子ども。街中には、誰もが楽しいアトラクションがいっぱい！ここでの合言葉は「We are kids!」。世界中の子どもたちが築いていく街を、みんなでいっしょに盛り上げよう！"}], "en": [{"z": {"x": 0.5, "y": 0.43, "s": 2.6}, "h": "The highlight: “360° Island”", "p": "The island floating in the middle, “360° Island,” is the symbol of this park. You reach it after passing through an underground entrance and shops. It’s like Cinderella Castle at Disney."}, {"z": {"x": 0.5, "y": 0.43, "s": 1.5}, "h": "Why 360°?", "p": "No matter how moving Cinderella Castle is, you first see it from a 180° angle. But from 360° Island, you can see the whole park all the way around. Each direction has its own theme, and every area is connected to the island by a footbridge."}, {"z": {"x": 0.25, "y": 0.25, "s": 2}, "h": "Virtual town (Spanish style)", "p": "A Spanish-style virtual town — an area that exists only here."}, {"z": {"x": 0.25, "y": 0.75, "s": 2}, "h": "Spain Area", "p": "This area recreates a real city in Spain. Here, you can play Latin music together with everyone, and ride the dark ride “Don Quixote and the Windmill Giants,” where, as you travel through the story, the windmills start to look like real giants."}, {"z": {"x": 0.75, "y": 0.75, "s": 2}, "h": "Las Vegas Area", "p": "This area recreates the real city of Las Vegas. From 360° Island, it looks like dazzling Las Vegas. But step into the back streets, and an unimaginable scene unfolds: Area 51, a facility that studies extraterrestrial life, and the hideout of a mysterious crime syndicate. Can you escape from this city…?"}, {"z": {"x": 0.75, "y": 0.25, "s": 2}, "h": "American Kids World", "p": "Welcome to a dazzling carnival town! Here, kids are the stars — and everyone who enters this area becomes a kid. The streets are packed with attractions everyone can enjoy! The password here is “We are kids!” Let’s all cheer on this town, built by children from all around the world!"}]}}, {"id": "hybrid", "title": "Hybrid Live Entertainment", "kind": "ライブエンターテイメント", "role": "企画", "short": "現実とARを、同じ舞台へ", "more": "https://euphonious-gnome-513e1a.netlify.app/", "text": "生身のキャストと、スマホ越しに見えるARのキャラクターが同じ空間で会話しながら、物語を進めていくライブ体験です。見るだけではなく、現実に参加するエンターテインメントをつくりたいと考えています。", "tags": ["WebAR", "Live Sync", "Portable"], "en": {"kind": "Live entertainment", "role": "Concept", "short": "Reality and AR on the same stage", "text": "A live experience where real cast members and AR characters you see through your phone talk with each other in the same space and move the story forward. I want to make entertainment you don’t just watch — you take part in it, for real."}, "story": {"ja": [{"h": "テーマ", "p": "現実とARを、同じ舞台へ。"}, {"h": "観客が物語を変える", "p": "観客の選択によって、物語や照明、演出、キャストの反応まで変わります。"}, {"h": "今ある場所を書き換える", "p": "大きなテーマパークを新しくつくるのではなく、今ある施設や街の空間そのものを書き換えます。アプリは不要で、QRコードを読みこむだけで参加できます。"}, {"h": "3つのしくみ", "p": "WebAR:アプリ不要、ブラウザだけで参加。Live Sync:AR・照明・音響・演技がリアルタイムで連動。Portable:小さな空間でも、世界中どこでも展開。"}], "en": [{"h": "The theme", "p": "Reality and AR on the same stage."}, {"h": "The audience changes the story", "p": "The audience’s choices change the story, the lighting, the staging, and even how the cast reacts."}, {"h": "Rewriting real places", "p": "Instead of building a huge new theme park, it rewrites spaces that already exist — buildings and streets. No app needed: just scan a QR code to join."}, {"h": "Three key ideas", "p": "WebAR: no app, join right in your browser. Live Sync: AR, lighting, sound and acting linked in real time. Portable: works in small spaces, anywhere in the world."}]}}, {"id": "mini", "title": "小型常設アトラクション", "kind": "アトラクション", "role": "企画", "short": "小さな場所に置ける、常設のアトラクション", "text": "小さな場所に常設できるアトラクションを企画しています。くわしい内容は、これから公開します。", "tags": ["アトラクション", "常設"], "en": {"title": "Compact Permanent Attraction", "kind": "Attraction", "role": "Concept", "short": "A permanent attraction that fits in a small space", "text": "I’m planning an attraction that can be installed permanently in a small space. More details are coming soon.", "tags": ["Attraction", "Permanent"]}}], "answers": {"home": {"ja": ["大阪を拠点に活動しています。"], "en": ["I’m based in Osaka, Japan."]}, "school": {"ja": ["N高等学校に通っています。"], "en": ["I go to N High School."]}, "univ": {"ja": ["大阪芸術大学に進学予定です。"], "en": ["I’m planning to go to Osaka University of Arts."]}, "nickname": {"ja": ["「ビーバー」は、私のニックネームです。"], "en": ["“Beaver” is my nickname."]}, "hobby": {"ja": ["趣味は、テーマパークに行くこと、ギター、ピアノです。"], "en": ["My hobbies are going to theme parks, guitar, and piano."]}, "personality": {"ja": ["思いついたら、すぐ形にしたくなる性格です。"], "en": ["Once I think of something, I want to make it real right away."]}, "food": {"ja": ["好きな食べ物は、ピザです。"], "en": ["My favorite food is pizza."]}, "english": {"ja": ["英語は、いま練習中です。", "外国の人と話すのが好きです。"], "en": ["I’m practicing English right now.", "I love talking with people from other countries."]}, "how": {"ja": ["思いついたアイデアを、AIを使って形にしています。"], "en": ["I take ideas I come up with and turn them into real things using AI."]}, "team": {"ja": ["半々くらいです。", "1人でつくることもあるし、学校のイベントや課外活動では、みんなでつくります。"], "en": ["About half and half.", "Sometimes I make things alone, and for school events and extracurricular programs, I make them with everyone."]}, "idea": {"ja": ["じつは、自分でもよくわからないんです。", "ふとしたときに思いつきます。"], "en": ["Honestly, I’m not sure myself.", "They just come to me out of nowhere."]}, "value": {"ja": ["「自分がゲストだったら楽しいか」を、いつも考えています。", "ゲストがその世界観に没入できるように、サイトも細部までこだわってつくっています。"], "en": ["I always ask myself: “Would this be fun if I were the guest?”", "So that guests can sink into the world, I care about every small detail, even on my websites."]}, "park": {"ja": ["いちばん好きなテーマパークは、ユニバ(USJ)です。小学2年生のときに初めて行って、めちゃめちゃハマりました。", "いつか、テーマパークのショーやアトラクションをつくる側に立ちたいと思っています。来た人が「日常」を忘れられるような体験をつくるのが目標です。"], "en": ["My favorite theme park is Universal Studios Japan (USJ). I went there for the first time in 2nd grade and got completely hooked.", "Someday I want to be on the side that creates the shows and attractions. My goal is to make experiences that let people forget their everyday life."]}, "ride": {"ja": ["好きなアトラクションは、ユニバの「スペース・ファンタジー・ザ・ライド」です。"], "en": ["My favorite attraction is “Space Fantasy – The Ride” at Universal Studios Japan."]}, "show": {"ja": ["キャラクターがメインのショーより、人がメインのショーが好きです。", "パレードは、どれも全部好きです。"], "en": ["I like shows where people are the stars more than shows centered on characters.", "And parades — I love every single one."]}, "career": {"ja": ["USJのような、テーマパークの会社でショーやアトラクションをつくりたいです。"], "en": ["I want to create shows and attractions at a theme park company like USJ."]}, "ent": {"ja": ["イマーシブシアターや、とにかくクレイジーなものが好きです。"], "en": ["Immersive theater, and anything that’s totally crazy."]}, "immersive": {"ja": ["見るだけではなく、その世界の中に入って参加する体験のことです。", "私がつくりたいのも、こういう体験です。"], "en": ["It means an experience where you don’t just watch — you step inside that world and take part.", "That’s exactly the kind of experience I want to make."]}, "music": {"ja": ["ギターとピアノを弾きます。ピアノは9年ほど続けています。", "音楽は、ショーやアトラクションの演出を考えるときの感覚の土台にもなっています。"], "en": ["I play guitar and piano. I’ve been playing piano for about 9 years.", "Music is also the base of my sense for staging when I think about shows and attractions."]}, "site": {"ja": ["このポートフォリオは、AIと話しながら作品を見られるようにつくりました。見るだけではなく、体験してもらいたかったからです。", "じつは、このページのどこかに、ちょっとしたイベントもかくれています。よかったら探してみてください。"], "en": ["I made this portfolio so you can see my work while chatting with an AI. I wanted you to experience it, not just look at it.", "Actually, there’s a little event hidden somewhere on this page. Try to find it if you like."]}, "job": {"ja": ["はい、内容によってお受けできます。まずはお問い合わせからご連絡ください。"], "en": ["Yes, depending on the project. Please reach out through Contact first."]}, "web": {"ja": ["はい、つくれます。お問い合わせからご相談ください。"], "en": ["Yes, I can. Feel free to ask through Contact."]}, "collab": {"ja": ["うれしいです!お問い合わせから気軽に声をかけてください。"], "en": ["That would make me happy! Feel free to reach out through Contact."]}}, "quickHero": {"ja": "テーマパークのショーやアトラクションのような体験をつくっています。アイデアを考えるだけで終わらせず、Webや映像で実際に動く形にするところまで自分でやります。", "en": "I create experiences like theme park shows and attractions. I don’t stop at ideas — I build them into things that actually work, on the web and on film, by myself."}, "game": {"teams": {"a": {"ja": "ビーバーチーム", "en": "Team Beaver", "color": "#e8743b"}, "b": {"ja": "ユウトチーム", "en": "Team Yuto", "color": "#3b7de8"}}, "games": [{"id": "parade", "type": "permanent", "show": true, "start": "", "end": "", "max": 300, "title": {"ja": "迷子のおしらせパレード", "en": "The Lost Child Parade"}, "desc": {"ja": "フロートのモニターに映った迷子の子を、人ごみの中から見つけるゲーム。", "en": "Find the lost kid shown on the parade float’s screen in the crowd."}}]}}</script>
<script>
(async function(){
/* ===== サイトの中身(管理サイトで編集したもの)を読みこむ ===== */
var DEFAULT_CONTENT=JSON.parse(document.getElementById('default-content').textContent);
async function loadContent(){
  try{
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},3000);
    var r=await fetch('/api/content',{cache:'no-store',signal:ctl.signal});clearTimeout(tm);
    if(r.ok){var j=await r.json();if(j&&j.works){var m={};for(var k in DEFAULT_CONTENT)m[k]=DEFAULT_CONTENT[k];for(var k2 in j)m[k2]=j[k2];return m}}
  }catch(e){}
  return DEFAULT_CONTENT;
}
var CONTENT=await loadContent();
if(CONTENT.dock&&!CONTENT.dock.some(function(d){return d.q==='game'}))CONTENT.dock=CONTENT.dock.concat([{q:'game',ja:'B-Play',en:'B-Play',show:true}]);
(CONTENT.dock||[]).forEach(function(d){if(d.q==='game'){if(d.ja==='ゲーム')d.ja='B-Play';if(d.en==='Games')d.en='B-Play'}});
var FLOAT_IMG='/img/float.webp';
var MEMORU_IMG='/img/memoru.jpg';
var TH_QUNASYS='/img/qunasys.jpg';
var TH_FILM='/img/film.jpg';
var YBE_IMG='/img/ybe.jpg';
var PARK_IMG='/img/park.webp';
var WORKS=CONTENT.works||[];
/* ===== ことば(日本語/英語) =====
   入力欄に「English」で英語、「日本語」で日本語にもどる */
var LANG='ja';
function T(ja,en){return LANG==='en'?en:ja}
function W(w,k){return LANG==='en'&&w.en&&w.en[k]!=null?w.en[k]:w[k]}
var WHEELS=[];
/* 幻のカード:迷子のおしらせパレード(5秒かくれて、3.5秒だけ見える をくり返す) */
var PHANTOM={id:'parade',phantom:true,title:'迷子のおしらせパレード',kind:'シークレットイベント',short:'見えているあいだだけ遊べる、幻のミニゲーム',
  en:{title:'The Lost Child Parade',kind:'Secret event',short:'A phantom mini-game you can only play while you can see it'}};
var PH_LIT=false,PH_SUBS=[];
(function phLoop(){
  setTimeout(function(){
    PH_LIT=true;PH_SUBS.forEach(function(f){f()});
    setTimeout(function(){PH_LIT=false;PH_SUBS.forEach(function(f){f()});phLoop()},3500);
  },5000);
})();
/* 作品ごとの「くわしく」スライド(横にスワイプ)。m:'img' のときは作品の画像を出す */
var FUTURE=CONTENT.future||[];
var STORY={};WORKS.concat(FUTURE).forEach(function(w){if(w.story)STORY[w.id]=w.story});
var BYF={};FUTURE.forEach(function(w){BYF[w.id]=w});
var BY={};WORKS.forEach(function(w){BY[w.id]=w});

var log=document.getElementById('log'),form=document.getElementById('f'),input=document.getElementById('q');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var busy=false;

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?0:ms)})}

/* 1文字ずつタイプ */
var hurry=false; /* trueのときは今の返事をすぐ最後まで出す */
function splitChars(node,text){
  node.textContent='';var list=[];
  Array.from(text).forEach(function(c){var sp=document.createElement('span');sp.className='ch';sp.textContent=c;node.appendChild(sp);list.push(sp)});
  return list;
}
function type(node,text,speed,isHello,keepCaret){
  return new Promise(function(res){
    var list=splitChars(node,text),shown=0,start=null,cur=null;
    function setCur(i){if(!isHello)return;if(cur)cur.classList.remove('cur');cur=list[i]||null;if(cur)cur.classList.add('cur')}
    function finish(){
      list.forEach(function(c){c.classList.add('on')});
      setCur(keepCaret?list.length-1:-1);res();
    }
    if(reduce||(hurry&&!isHello)||!list.length)return finish();
    function step(now){
      if(start===null)start=now;
      if(hurry&&!isHello)return finish();
      var n=Math.min(list.length,Math.floor((now-start)/speed)+1);
      while(shown<n){list[shown].classList.add('on');shown++}
      setCur(shown-1);
      if(shown>=list.length){setCur(keepCaret?list.length-1:-1);return res()}
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function scrollToShow(node){
  var r=node.getBoundingClientRect(),limit=window.innerHeight-170;
  if(r.bottom>limit)window.scrollBy({top:r.bottom-limit,behavior:reduce?'auto':'smooth'});
}

/* 最初のあいさつ */
var hi=document.getElementById('hi');
var start=document.querySelector('.hello .start');
/* あいさつを画面のど真ん中に置くための、ずらす量 */
function centerOffset(){
  var keep=hi.style.transform;hi.style.transform='';
  var r=hi.getBoundingClientRect();hi.style.transform=keep;
  return Math.round(window.innerHeight/2-(r.top+r.height/2));
}
/* 管理サイトの内容で、あいさつとオープニングの文字を入れる */
(function(){
  var h=document.getElementById('hi'),sp=h.querySelectorAll('span[aria-hidden]'),a=(CONTENT.hello&&CONTENT.hello.ja)||[];
  if(a.length){sp[0].textContent=a[0];sp[1].textContent=a[1]||'';h.setAttribute('aria-label',a.join(''))}
  var it=CONTENT.intro||{},cap=document.querySelector('#pk .pk-cap');
  var pkEl=document.getElementById('pk');
  if(pkEl){pkEl.style.setProperty('--pk-pc',Math.min(100,Math.max(30,Number(it.sizePc)||60))+'%');pkEl.style.setProperty('--pk-sp',Math.min(100,Math.max(40,Number(it.sizeSp)||100))+'%')}
  if(cap&&it.caption){cap.innerHTML='<b>'+esc(it.caption.ja||'')+'</b>'+(it.sub&&it.sub.ja?'<span>'+esc(it.sub.ja)+'</span>':'')+(it.sub&&it.sub.en?'<span>'+esc(it.sub.en)+'</span>':'')}
})();
/* 0. パークの絵を見せてから、あいさつへ */
var introDone=new Promise(function(res){
  var pk=document.getElementById('pk');if(!pk)return res();
  if(CONTENT.intro&&CONTENT.intro.show===false){pk.remove();return res()}
  var im=pk.querySelector('img'),done=false,timers=[];
  function finish(){
    if(done)return;done=true;timers.forEach(clearTimeout);
    pk.classList.add('out');setTimeout(function(){pk.remove();res()},reduce?0:800);
  }
  pk.addEventListener('click',finish);
  document.addEventListener('keydown',function k(){document.removeEventListener('keydown',k);finish()});
  function start(){
    if(done||pk.classList.contains('go'))return;
    pk.classList.add('go');
    timers.push(setTimeout(function(){pk.classList.add('cap')},reduce?0:1200));
    timers.push(setTimeout(finish,reduce?2200:4500));
  }
  im.onload=start;im.onerror=finish;
  im.src=(CONTENT.intro&&CONTENT.intro.image)||PARK_IMG;
  if(im.complete&&im.naturalWidth)start();
  timers.push(setTimeout(start,1500));
});
var openingDone=(async function(){
  if(!reduce)document.body.classList.add('intro');
  var parts=hi.querySelectorAll('span[aria-hidden]'),texts=[].map.call(parts,function(s){return s.textContent});
  if(!reduce)parts.forEach(function(p,i){splitChars(p,texts[i])});
  await introDone;
  /* 1. 最初はあいさつだけを、画面のど真ん中に(作品の場所ができてから測る) */
  await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});
  if(!reduce)hi.style.transform='translateY('+centerOffset()+'px)';
  await wait(400);
  for(var i=0;i<parts.length;i++){
    var talking=document.body.classList.contains('talking');
    await type(parts[i],texts[i],talking?0:120,true,i===parts.length-1&&!talking);
  }
  await wait(500);
  /* 2. 打ち終わったら、いつもの位置へすーっと上がる */
  if(!reduce&&!document.body.classList.contains('talking')){
    var dy=centerOffset();hi.style.transform='';
    if(dy){var mv=hi.animate([{transform:'translateY('+dy+'px)'},{transform:'none'}],{duration:900,easing:'cubic-bezier(.22,.61,.36,1)'});await mv.finished.catch(function(){})}
  }
  hi.style.transform='';
  hi.querySelectorAll('.cur').forEach(function(x){x.classList.remove('cur')}); /* カーソルはオープニングの間だけ */
  /* 3. 作品・ボタン・入力欄をいっしょに出す */
  start.classList.add('show');
  document.body.classList.add('ready');
  setTimeout(function(){document.body.classList.remove('intro')},1700);
})();

function userSay(text){var m=el('div','msg user');m.appendChild(el('span',null,esc(text)));log.appendChild(m);scrollToShow(m)}

async function aiSay(src){
  busy=true;
  try{
    var m=el('div','msg ai');var dots=el('div','dots','<i></i><i></i><i></i>');m.appendChild(dots);
    log.appendChild(m);scrollToShow(m);
    var all=await Promise.all([Promise.resolve(src),hurry?0:wait(500)]);
    var blocks=all[0];
    dots.remove();
    for(var k=0;k<blocks.length;k++){
      var b=blocks[k];
      if(typeof b==='string'){var p=el('p');m.appendChild(p);var t=type(p,b,24);scrollToShow(p);await t}
      else{m.appendChild(b);scrollToShow(b);if(b._typeIn){await b._typeIn();scrollToShow(b)}else if(!hurry)await wait(120)}
    }
  }finally{busy=false}
}

function bindQ(b){
  b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();ask(b.dataset.label||b.textContent,b.dataset.q)});
  return b;
}
function chips(list){
  var c=el('div','chips');
  list.forEach(function(x){var b=el('button','chip',x[3]||esc(x[0]));b.type='button';b.dataset.q=x[1];if(x[2])b.dataset.label=x[2];c.appendChild(bindQ(b))});
  return c;
}
/* かくれイベントの行(作品一覧の下に、出たり消えたりする) */
function aboutWork(w){return T(W(w,'title')+'について教えて','Tell me about '+W(w,'title'))}
function evHTML(){return T('<b>迷子のおしらせパレード</b><span class="small">イベント</span>','<b>The Lost Child Parade</b><span class="small">Event</span>')}
function eventRow(){
  var l=el('div','works evrow');
  var ev=el('button','ev',evHTML());
  ev.type='button';ev.addEventListener('click',function(e){e.preventDefault();openParade()});
  l.appendChild(ev);return l;
}
function workList(){
  var l=el('div','works');
  WORKS.forEach(function(w){
    var b=el('button',null,'<b>'+esc(W(w,'title'))+'</b><span class="small">'+esc(W(w,'kind'))+'</span>');
    b.type='button';b.dataset.q='w:'+w.id;b.dataset.label=aboutWork(w);l.appendChild(bindQ(b));
  });
  var ev=el('button','ev',evHTML());
  ev.type='button';ev.addEventListener('click',function(e){e.preventDefault();openParade()});
  l.appendChild(ev);
  return l;
}
/* 作品の説明:見た目→タイピングで概要→横スワイプでくわしく */
function workBlocks(w){
  /* 1枚目は「概要」(タイピングで出す)、2枚目からがくわしい話 */
  var st=STORY[w.id],items=[{h:T('概要','Overview'),p:W(w,'text'),typed:true}].concat(st?(st[LANG]||st.ja):[]);
  return [detail(w,true),storyEl(w,items)];
}
function storyEl(w,items){
  var box=el('div','story');box.setAttribute('role','region');box.setAttribute('aria-roledescription',T('スライド','carousel'));box.setAttribute('aria-label',T(W(w,'title')+'のくわしい説明',W(w,'title')+' — details'));
  /* 画像をズームしながら説明する作品(パーク)用 */
  var vw=null,vimg=null,vlab=null;
  if(w.viewer&&w.img){
    vw=el('div','st-viewer');vimg=new Image();vimg.src=w.img;vimg.alt=W(w,'title');vimg.draggable=false;vw.appendChild(vimg);
    vlab=el('span','st-vlab');vw.appendChild(vlab);box.appendChild(vw);
  }
  function zoomTo(k){
    if(!vw)return;var it=items[k]||{},z=it.z||{x:.5,y:.5,s:1};
    var tx=Math.min(0,Math.max(1-z.s,.5-z.x*z.s)),ty=Math.min(0,Math.max(1-z.s,.5-z.y*z.s));
    vimg.style.transform='translate('+(tx*100).toFixed(2)+'%,'+(ty*100).toFixed(2)+'%) scale('+z.s+')';
    vlab.textContent=it.h||'';vlab.classList.toggle('on',k>0);
  }
  var view=el('div','st-view');box.appendChild(view);
  items.forEach(function(it,i){
    var sl=el('div','st-slide');sl.setAttribute('aria-label',(i+1)+' / '+items.length);
    var cap=el('p','st-cap','<b>'+esc(it.h)+'</b>');
    var tx=el('span',null,it.typed?'':esc(it.p));cap.appendChild(tx);
    if(it.typed){box._typeIn=function(){return type(tx,it.p,24)}}
    sl.appendChild(cap);
    view.appendChild(sl);
  });
  var bar=el('div','st-bar'),dots=el('div','st-dots');
  if(items.length<2)box.classList.add('one');
  items.forEach(function(){dots.appendChild(el('i'))});
  var pv=el('button','st-nav','‹'),nx=el('button','st-nav','›');pv.type=nx.type='button';
  pv.setAttribute('aria-label',T('前へ','Previous'));nx.setAttribute('aria-label',T('次へ','Next'));
  var navs=el('div','st-navs');navs.appendChild(pv);navs.appendChild(nx);
  bar.appendChild(dots);bar.appendChild(navs);box.appendChild(bar);
  function step(){var s=view.children[0];return s?s.getBoundingClientRect().width+(parseFloat(getComputedStyle(view).columnGap)||0):view.clientWidth}
  function cur(){var st=step();if(st<=0)return 0;if(view.scrollLeft>0&&view.scrollLeft>=view.scrollWidth-view.clientWidth-2)return items.length-1;return Math.round(view.scrollLeft/st)}
  var lastK=-1;
  function sync(){var k=cur();if(k!==lastK){lastK=k;zoomTo(k)}[].forEach.call(dots.children,function(d,i){d.classList.toggle('on',i===k)});pv.disabled=k<=0;nx.disabled=k>=items.length-1}
  function goTo(k){k=Math.max(0,Math.min(items.length-1,k));view.scrollTo({left:k*step(),behavior:reduce?'auto':'smooth'})}
  pv.addEventListener('click',function(){goTo(cur()-1)});nx.addEventListener('click',function(){goTo(cur()+1)});
  view.addEventListener('scroll',function(){requestAnimationFrame(sync)},{passive:true});
  /* PCはマウスでつかんで横に動かせる */
  var dg=null;
  view.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0)return;dg={x:e.clientX,l:view.scrollLeft,k:cur(),moved:false};view.classList.add('drag')});
  window.addEventListener('pointermove',function(e){if(!dg)return;var dx=e.clientX-dg.x;if(Math.abs(dx)>4)dg.moved=true;view.scrollLeft=dg.l-dx});
  window.addEventListener('pointerup',function(e){if(!dg)return;var dx=e.clientX-dg.x,k=dg.k;dg=null;view.classList.remove('drag');goTo(Math.abs(dx)>40?k+(dx<0?1:-1):k)});
  view.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();goTo(cur()+1)}else if(e.key==='ArrowLeft'){e.preventDefault();goTo(cur()-1)}});
  view.tabIndex=0;
  sync();
  if(window.ResizeObserver)new ResizeObserver(function(){sync()}).observe(view);
  return box;
}

   送信は Netlify Forms(このページの下にある name="contact" のフォーム)を使います。
   送れなかったときは、内容が入った状態でメールアプリを開けるようにします。 */
var flow=null;
var STEPS={
  name:{ph:['お名前を入力','Your name'],type:'text',ac:'name',max:80},

var box=document.querySelector('.box');
function syncBox(){box.classList.toggle('wide',document.activeElement===input||input.value!==''||!!flow)}
input.addEventListener('focus',syncBox);input.addEventListener('blur',function(){setTimeout(syncBox,120)});input.addEventListener('input',syncBox);

function setInput(step){
  var c=step?STEPS[step]:{ph:['質問を入力','Ask me anything'],type:'text',ac:'off',max:120};
  input.placeholder=T(c.ph[0],c.ph[1]);input.type=c.type;syncBox();input.setAttribute('autocomplete',c.ac);input.maxLength=c.max;

function setDockRaw(list,firstStrong){
  var c=chips(list);if(firstStrong)c.firstChild.classList.add('next');

function flowDock(){
  if(!flow)return setDock();
  if(flow.step==='subject')return setDockRaw([[T('スキップ','Skip'),'skip',T('件名はなし','No subject')],[T('やめる','Cancel'),'cancel']]);
  if(flow.step==='confirm')return setDockRaw([[T('送信する','Send'),'send'],[T('書き直す','Start over'),'mail',T('最初から書き直す','Start over')],[T('やめる','Cancel'),'cancel']],true);
  setDockRaw([[T('やめる','Cancel'),'cancel']]);
}
function go(step){flow.step=step;setInput(step);flowDock()}
function endFlow(){flow=null;setInput(null);setDock()}
function summary(){
  var d=flow.data;
  return rows([[T('お名前','Name'),d.name],[T('メール','Email'),d.email],[T('件名','Subject'),d.subject||T('(なし)','(none)')],[T('メッセージ','Message'),d.message]]);

function isEmail(t){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t)}
function flowAnswer(t){
  var d=flow.data;
  switch(flow.step){
    case 'name':d.name=t;go('email');
      return T([t+'さん、ありがとうございます。','お返事を送るメールアドレスを教えてください。'],['Thank you, '+t+'.','What email address should I reply to?']);
    case 'email':
      if(!isEmail(t))return[T('メールアドレスの形になっていないようです。もう一度入力してください。(例:name@example.com)','That doesn’t look like an email address. Please try again. (e.g. name@example.com)')];
      d.email=t;go('subject');
      return[T('件名はありますか?なければ「スキップ」を押してください。','Is there a subject? If not, tap “Skip.”')];
    case 'subject':d.subject=t;go('message');
      return[T('最後に、メッセージを書いてください。','Last step: please write your message.')];
    case 'message':d.message=t;go('confirm');
      return[T('この内容で送ります。よろしければ「送信する」を押してください。','This is what I’ll send. If it looks good, tap “Send.”'),summary()];
    default:
      return[T('送るときは、下の「送信する」を押してください。','To send it, tap “Send” below.')];
  }
}
function mailtoLink(){
  var d=flow?flow.data:{};
  var body=T('お名前: ','Name: ')+(d.name||'')+T('\nメール: ','\nEmail: ')+(d.email||'')+'\n\n'+(d.message||'');
  var a=el('a','opt','<b>'+T('メールアプリで送る','Open in your email app')+'</b><span>'+esc(MAIL)+'</span>');
  a.href='mailto:'+MAIL+'?subject='+encodeURIComponent(d.subject||T('ポートフォリオを見てご連絡しました','Contact from your portfolio'))+'&body='+encodeURIComponent(body);
  var w=el('div','pick');w.appendChild(a);return w;
}
async function sendFlow(){
  var d=flow.data;
  try{
    var body=new URLSearchParams({'form-name':'contact','bot-field':'',name:d.name,email:d.email,subject:d.subject||'',message:d.message}).toString();
    var res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body});
    if(!res.ok)throw new Error(res.status);
    var n=d.name;endFlow();
    return T([n+'さん、送信しました。ありがとうございます。','2〜3日以内に、メールでお返事します。'],['Sent! Thank you, '+n+'.','I’ll reply by email within 2–3 days.']);
  }catch(e){
    var link=mailtoLink();endFlow();
    return[T('ごめんなさい、うまく送れませんでした。','Sorry, something went wrong and it wasn’t sent.'),T('下のボタンを押すと、入力した内容が入った状態でメールアプリが開きます。','Tap the button below to open your email app with everything filled in.'),link];
  }
}

  var cur=Array.from(line.textContent),bv=Array.from((LANG==='en'?CONTENT.hello.beaverEn:CONTENT.hello.beaverJa)||'');

  chars().forEach(function(c){c.classList.add('on')});

function makeRound(r){

  var t={hat:pick(PD.HAT.slice(1)),shirt:pick(PD.SHIRT),bal:r===0?pick(PD.BAL):pick(PD.BAL.slice(1)),gl:r===2&&Math.random()<.5};
  var list=[],keys={};keys[keyOf(t)]=1;
  function add(c){var k=keyOf(c);if(keys[k])return false;if(r===0&&c.hat===t.hat)return false;keys[k]=1;list.push(c);return true}
  var fields=r===1?['hat','bal']:['hat','shirt','bal','gl'],guard=0;
  while(list.length<cfg.near&&guard++<500){
    var c={hat:t.hat,shirt:t.shirt,bal:t.bal,gl:t.gl},f=pick(fields);
    if(f==='hat')c.hat=pick(PD.HAT);else if(f==='shirt')c.shirt=pick(PD.SHIRT);else if(f==='bal')c.bal=pick(PD.BAL);else c.gl=!c.gl;
    if(r===1){c.shirt=pick(PD.SHIRT);c.gl=false}

  guard=0;
  while(list.length<cfg.n-1&&guard++<2000)add({hat:pick(PD.HAT),shirt:pick(PD.SHIRT),bal:pick(PD.BAL),gl:r===2&&Math.random()<.3});

/* ===== 作品の半円ホイール =====

function makeWheel(items,prefix){

    else c.appendChild(el('span','t',''));
    stage.appendChild(c);return c;
  });
  /* ことばが変わったら、作品名や説明を入れ直す */
  function labels(){
    wheel.setAttribute('aria-roledescription',T('カルーセル','carousel'));wheel.setAttribute('aria-label',prefix==='f:'?T('これからつくりたいもの','What’s next'):T('作品','Works'));
    prev.setAttribute('aria-label',T('前へ','Previous'));next.setAttribute('aria-label',T('次へ','Next'));
    cards.forEach(function(c,i){c.setAttribute('aria-label',W(list[i],'title'));var t=c.querySelector('.t');if(t)t.textContent=W(list[i],'title')});
  }

  WHEELS.push(function(){labels();shown=-1;draw()});
  var phI=list.length-1;
  function phSync(){
    if(!list[phI].phantom)return;
    cards[phI].classList.toggle('lit',PH_LIT);

  }
  PH_SUBS.push(phSync);phSync();
  /* 大きさ:真ん中を大きく、両どなりは小さく。1画面に収まるように高さからも上限を決める */
  var lastW=0;
  function geom(){
    var W=wheel.clientWidth||Math.min(window.innerWidth-32,1100);lastW=W;
    var narrow=W<700;
    var byH=(window.innerHeight-(narrow?440:456))/(narrow?1.05:0.95);
    var cw=Math.round(Math.max(190,Math.min(narrow?W*0.8:W*0.38,narrow?320:460,byH)));
    wheel.style.setProperty('--wh-w',cw+'px');

  }

      c.style.opacity=o.toFixed(3);c.style.zIndex=String(100-Math.round(ad*10));

  }
  function showDesc(k){
    var w=list[k];
    desc.classList.add('fade');
    setTimeout(function(){
      if(w.phantom&&!PH_LIT){
        desc.innerHTML='<span class="k">???</span><b>……</b><p>'+esc(T('ここには、何もないみたいです。','Nothing seems to be here.'))+'</p>';
        desc.classList.remove('fade');return;

      var g=el('button','go2',w.phantom?T('タップして遊ぶ','Tap to play'):T('タップしてくわしく見る','Tap for details'));g.type='button';

  }
  function go(t){target=t;animate()}
  function open(k){var w=list[k];if(w.phantom){if(PH_LIT)openGame();return}ask(aboutWork(w),prefix+w.id)}
  /* ドラッグで回す */
  var drag=null;
  stage.addEventListener('pointerdown',function(e){
    if(e.button!==undefined&&e.button!==0)return;
    cancelAnimationFrame(raf);

  }
  window.addEventListener('pointerup',end);window.addEventListener('pointercancel',function(){if(drag){drag=null;stage.classList.remove('drag');go(Math.round(pos))}});
  stage.addEventListener('touchmove',function(e){if(drag&&drag.moved)e.preventDefault()},{passive:false});
  /* PCのトラックパッドで横にスワイプしたとき(マウスのShift+ホイールも)も回す */
  var snapT=0;
  wheel.addEventListener('wheel',function(e){
    var dx=e.deltaX,dy=e.deltaY;
    if(e.shiftKey&&!dx){dx=dy;dy=0}
    if(Math.abs(dx)<=Math.abs(dy))return; /* たてのスクロールはページにまかせる */
    e.preventDefault();
    if(e.deltaMode===1)dx*=16;else if(e.deltaMode===2)dx*=wheel.clientWidth;
    cancelAnimationFrame(raf);
    pos+=Math.max(-0.6,Math.min(0.6,dx/(pxItem()*1.1)));target=pos;draw();
    clearTimeout(snapT);snapT=setTimeout(function(){go(Math.round(pos))},140);
  },{passive:false});
  /* キーボードでも押せるように */
  cards.forEach(function(c,i){c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(i)}})});
  prev.addEventListener('click',function(){go(Math.round(target)-1)});
  next.addEventListener('click',function(){go(Math.round(target)+1)});
  wheel.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();go(Math.round(target)-1)}
    else if(e.key==='ArrowRight'){e.preventDefault();go(Math.round(target)+1)}
    else if(e.key==='Enter'){e.preventDefault();open(idx())}
  });
  window.addEventListener('resize',function(){G=geom();draw()});
  draw();
  return wrapEl;
}

/* 返事の途中で押されたら、今の返事を一気に出してから次へ進む */
var queue=Promise.resolve();
function ask(label,key){
  document.body.classList.add('talking','ready');
  /* 会話が始まったら、どんな入力(隠しコマンドも)でも「作品を見せて」をボタンにもどす */
  if(!flow&&!dock.querySelector('[data-q="works"]'))setDock();
  var c=hi.querySelector('.cur');if(c)c.classList.remove('cur');
  if(busy)hurry=true;
  queue=queue.then(async function(){
    hurry=false;
    if(label)userSay(label);
    await aiSay(typeof key==='function'?key():typeof key==='string'?reply(key):key);
  }).catch(function(){busy=false;hurry=false});
}
document.getElementById('startArea').appendChild(makeWheel());
form.addEventListener('submit',function(e){
  e.preventDefault();var t=input.value.trim();
  if(!t){if(!flow)openLock();return}
  input.value='';
  var lg=langCmd(t);
  if(lg){input.blur();ask(t,function(){return setLang(lg)});return}
  if(flow){ask(t,function(){return flowAnswer(t)});return}
  input.blur();
  var sec=findSecret(t);
  if(sec){ask(t,function(){return sec.run()});return}
  ask(t,function(){return reply(route(t))});
});
})();
</script>
