<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>管理サイト｜Hayashi Yuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--muted:#777;--line:#e4e4e4;--soft:#f4f4f4;--ok:#1a7f37;--bad:#c62828;--f-body:"Zen Kaku Gothic New",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* 上のバー */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.05rem;margin-right:auto}
.top h1 small{display:block;font-family:var(--f-mono);font-size:.68rem;font-weight:400;color:var(--muted);letter-spacing:.08em}
.state{font-size:.8rem;color:var(--muted)}
.state.dirty{color:var(--bad)}
.btn{border:1px solid var(--fg);border-radius:999px;padding:7px 16px;font-size:.88rem;line-height:1.4;background:var(--bg);text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.main{background:var(--fg);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.main:hover{background:#333}
.btn.main:disabled{background:#bbb;border-color:#bbb;cursor:default}
.btn.sm{padding:4px 12px;font-size:.8rem}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:#fdecea}
.tabs{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;border-bottom:2px solid transparent;padding:8px 10px 10px;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:700}

main{max-width:980px;margin:0 auto;padding:20px 16px 120px}
.panel h2{font-size:1.2rem;margin:0 0 4px}
.panel > p.lead{margin:0 0 18px;color:var(--muted);font-size:.88rem}
.hint{color:var(--muted);font-size:.8rem;margin:2px 0 0}

/* 並べかえられる一覧 */
.list{display:grid;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.item.drag{opacity:.4}
.item.over{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg) inset}
.grip{cursor:grab;color:var(--muted);font-size:1.1rem;padding:4px;user-select:none;touch-action:none}
.thumb{width:72px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--fg);color:#fff;flex:none;display:grid;place-items:center;font-size:.6rem;text-align:center;padding:2px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1;min-width:0}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{font-size:.78rem;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mv{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;padding:0}
.mv:disabled{opacity:.3;cursor:default}
.item.off .meta{opacity:.45}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;white-space:nowrap}
.sw input{width:18px;height:18px;accent-color:#111}

/* 入力欄 */
.field{display:grid;gap:4px;margin:0 0 14px}
.field > span{font-size:.82rem;font-weight:700}
.field input[type=text],.field input[type=url],.field input[type=number],.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg)}
.field textarea{min-height:90px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.card h3{margin:0 0 12px;font-size:1rem}
details.card > summary{cursor:pointer;font-weight:700;list-style:none}
details.card > summary::before{content:"＋ "}
details.card[open] > summary::before{content:"－ "}
details.card[open] > summary{margin-bottom:12px}

/* 画像 */
.img-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.img-box .pv{width:160px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.img-box .pv img{width:100%;height:100%;object-fit:cover;display:block}

/* 表(プロフィールなど) */
.rows{display:grid;gap:8px;margin-bottom:10px}
.rowed{display:grid;grid-template-columns:1fr 2fr auto auto auto;gap:6px;align-items:center}
.rowed input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}

/* スライド */
.slides{display:grid;gap:10px;margin-bottom:10px}
.slide{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.slide-head{display:flex;align-items:center;gap:8px}
.slide-head b{margin-right:auto;font-size:.82rem;color:var(--muted)}
.slide input,.slide textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.slide textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px;margin-bottom:10px}
.seg button{border:0;border-radius:999px;padding:5px 14px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* ズームの場所えらび */
.zoom{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.zpick,.zprev{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.zpick{cursor:crosshair}
.zpick img,.zprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.zprev img{transform-origin:0 0;transition:transform .5s}
.zdot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#e53935;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
.zctl{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:.82rem}
.zctl input[type=range]{flex:1;accent-color:#111}

/* 編集画面 */
dialog{border:0;padding:0;width:min(760px,100vw);max-width:100vw;max-height:100dvh;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:8px}
.dlg-head h2{margin:0 auto 0 0;font-size:1rem}
.dlg-body{padding:16px}

.sizes{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
.size{display:grid;gap:8px}
.size-head{display:flex;justify-content:space-between;font-size:.82rem}
.size input[type=range]{width:100%;accent-color:#111}
.frame{border:2px solid var(--fg);border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.frame.pc{aspect-ratio:16/10}
.frame.sp{aspect-ratio:9/19;max-width:140px;justify-self:center;width:100%}
.frame img{object-fit:contain;display:block;max-width:100%;max-height:100%}
.frame.sp img{height:auto}
@media (max-width:640px){.sizes{grid-template-columns:1fr}}
.scores{display:grid;gap:10px}
.sc-tot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc-team{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.sc-team span{font-size:.8rem;color:var(--muted)}
.sc-team b{font-size:1.6rem;font-family:var(--f-mono)}
.sc-adj{display:flex;gap:6px}
.sc-adj input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.sc-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-top:1px solid var(--line);padding-top:8px;font-size:.88rem}
.sc-row .mono{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-right:auto}
.scores > .btn{justify-self:start}
.gdet{margin-top:6px}
.gdet summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.gdet[open]{padding-bottom:4px}
.gdet select,.addg select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.addg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
input[type=color]{width:60px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--fg);color:#fff;border-radius:999px;padding:10px 20px;font-size:.88rem;transition:opacity .3s,transform .3s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:640px){
  .two{grid-template-columns:1fr}
  .item{flex-wrap:wrap}
  .acts{width:100%;justify-content:flex-start}
  .rowed{grid-template-columns:1fr 1fr auto;grid-auto-rows:auto}
  .rowed input:nth-child(2){grid-column:2}
  .zoom{grid-template-columns:1fr}
  dialog{width:100vw;height:100dvh;border-radius:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>管理サイト<small>HAYASHI YUTO PORTFOLIO</small></h1>
    <span class="state" id="state" role="status">読みこみ中…</span>
    <a class="btn" href="/" target="_blank" rel="noopener">サイトを見る ↗</a>
    <button class="btn main" id="save" type="button" disabled>保存する</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="編集するところ"></nav>
</header>
<main id="main"><p class="loading">読みこみ中…</p></main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlg-head">
    <h2 id="dlgTitle">編集</h2>
    <button class="btn sm" type="button" id="dlgCancel">キャンセル</button>
    <button class="btn sm main" type="button" id="dlgOk">この内容にする</button>
  </div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var data=null,dirty=false,tab='works';
var main=document.getElementById('main'),saveBtn=document.getElementById('save'),stateEl=document.getElementById('state');

/* ---------- 小さな道具 ---------- */
function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='text')e.textContent=v;else if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else if(k==='checked')e.checked=!!v;else e.setAttribute(k,v===true?'':v)}
  (kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
  return e;
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function toast(msg,bad){var t=document.getElementById('toast');t.textContent=msg;t.classList.toggle('bad',!!bad);t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},bad?5000:2600)}
function markDirty(){dirty=true;saveBtn.disabled=false;stateEl.textContent='保存していない変更があります';stateEl.classList.add('dirty')}
function markClean(text){dirty=false;saveBtn.disabled=true;stateEl.textContent=text||'保存済み';stateEl.classList.remove('dirty')}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function lines(t){return String(t||'').split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function tags(t){return String(t||'').split(/[,、，]/).map(function(s){return s.trim()}).filter(Boolean)}
function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return false;var x=arr[i];arr[i]=arr[j];arr[j]=x;return true}
function en(o){if(!o.en)o.en={};return o.en}

/* 入力欄(値が変わったら set を呼ぶ) */
function input(label,value,set,opt){
  opt=opt||{};
  var ctl=opt.multi?h('textarea',{value:value||'',rows:opt.rows||4}):h('input',{type:opt.type||'text',value:value==null?'':value,placeholder:opt.ph||null});
  ctl.addEventListener('input',function(){set(ctl.value);if(!opt.local)markDirty()});
  return h('label',{class:'field'},[h('span',{text:label}),ctl,opt.hint?h('p',{class:'hint',text:opt.hint}):null]);
}
function check(label,value,set,opt){
  var c=h('input',{type:'checkbox',checked:value});
  c.addEventListener('change',function(){set(c.checked);if(!(opt&&opt.local))markDirty()});
  return h('label',{class:'sw'},[c,label]);
}

/* ---------- 画像のアップロード(大きい画像は小さくしてから送る) ---------- */
function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1800,w=img.naturalWidth,hh=img.naturalHeight,s=Math.min(1,max/Math.max(w,hh));
      var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(hh*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('画像を変換できませんでした'))},'image/webp',.82);
    };
    img.onerror=function(){rej(new Error('画像を読みこめませんでした'))};
    img.src=url;
  });
}
async function upload(file){
  var blob=await shrink(file);
  var r=await fetch('/admin/api/upload',{method:'POST',headers:{'Content-Type':blob.type||'image/webp'},body:blob,credentials:'same-origin'});
  var j=await r.json().catch(function(){return{}});
  if(!r.ok)throw new Error(j.error||('アップロードに失敗しました('+r.status+')'));
  return j.url;
}
function imageField(label,value,set,opt){
  opt=opt||{};
  var pv=h('div',{class:'pv'});
  function draw(v){pv.innerHTML='';if(v){pv.appendChild(h('img',{src:v,alt:''}))}else pv.textContent='画像なし'}
  draw(value);
  var file=h('input',{type:'file',accept:'image/*',hidden:true});
  var up=h('button',{class:'btn sm',type:'button',text:'画像をえらぶ',onclick:function(){file.click()}});
  var rm=h('button',{class:'btn sm danger',type:'button',text:'外す',onclick:function(){set('');draw('');if(!opt.local)markDirty();if(opt.onchange)opt.onchange('')}});
  file.addEventListener('change',async function(){
    var f=file.files[0];if(!f)return;up.disabled=true;up.textContent='アップロード中…';
    try{var u=await upload(f);set(u);draw(u);if(!opt.local)markDirty();if(opt.onchange)opt.onchange(u);toast('画像をアップロードしました')}
    catch(e){toast(e.message,true)}
    up.disabled=false;up.textContent='画像をえらぶ';file.value='';
  });
  return h('div',{class:'field'},[h('span',{text:label}),h('div',{class:'img-box'},[pv,up,rm,file]),opt.hint?h('p',{class:'hint',text:opt.hint}):null]);
}

/* ---------- 並べかえられる一覧 ---------- */
function sortable(arr,render,opt){
  opt=opt||{};
  var ul=h('ul',{class:'list'}),dragI=-1;
  arr.forEach(function(it,i){
    var li=h('li',{class:'item'+(opt.isOff&&opt.isOff(it)?' off':'')});
    var up=h('button',{class:'mv',type:'button','aria-label':'上へ',text:'↑',disabled:i===0,onclick:function(){if(move(arr,i,-1)){markDirty();rerender()}}});
    var dn=h('button',{class:'mv',type:'button','aria-label':'下へ',text:'↓',disabled:i===arr.length-1,onclick:function(){if(move(arr,i,1)){markDirty();rerender()}}});
    /* ⠿ をつかんだときだけドラッグできる(入力欄の文字を選べるように) */
    var grip=h('span',{class:'grip','aria-hidden':'true',text:'⠿'});
    grip.addEventListener('pointerdown',function(){li.setAttribute('draggable','true')});
    grip.addEventListener('pointerup',function(){li.removeAttribute('draggable')});
    li.appendChild(grip);
    render(it,i,li,h('div',{class:'acts'},[up,dn]));
    li.addEventListener('dragstart',function(e){dragI=i;li.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(i))}catch(_){}});
    li.addEventListener('dragend',function(){li.removeAttribute('draggable');li.classList.remove('drag');ul.querySelectorAll('.over').forEach(function(x){x.classList.remove('over')})});
    li.addEventListener('dragover',function(e){e.preventDefault();li.classList.add('over')});
    li.addEventListener('dragleave',function(){li.classList.remove('over')});
    li.addEventListener('drop',function(e){e.preventDefault();if(dragI<0||dragI===i)return;var x=arr.splice(dragI,1)[0];arr.splice(i,0,x);dragI=-1;markDirty();rerender()});
    ul.appendChild(li);
  });
  return ul;
}

/* ---------- タブ ---------- */
var TABS=[['works','作品'],['future','これから'],['game','B-Play'],['dock','ボタン'],['intro','オープニング'],['quick','短縮版'],['answers','質問の答え'],['profile','プロフィール']];
function drawTabs(){
  var nav=document.getElementById('tabs');nav.innerHTML='';
  TABS.forEach(function(t){nav.appendChild(h('button',{type:'button',role:'tab','aria-selected':String(tab===t[0]),text:t[1],onclick:function(){tab=t[0];drawTabs();rerender();window.scrollTo(0,0)}}))});
}
function rerender(){
  var y=window.scrollY;main.innerHTML='';
  var p=h('section',{class:'panel'});main.appendChild(p);
  ({works:panelWorks,future:panelFuture,game:panelGame,dock:panelDock,intro:panelIntro,quick:panelQuick,answers:panelAnswers,profile:panelProfile})[tab](p);
  window.scrollTo(0,y);
}

/* ---------- 作品・これから ---------- */
function projectList(p,key,label){
  var arr=data[key];
  p.appendChild(sortable(arr,function(w,i,li,acts){
    var th=h('div',{class:'thumb'});var src=w.thumb||w.img;
    if(src)th.appendChild(h('img',{src:src,alt:''}));else th.textContent=w.title||'';
    li.appendChild(th);
    li.appendChild(h('div',{class:'meta'},[h('b',{text:w.title||'(タイトルなし)'}),h('span',{text:[w.kind,w.short].filter(Boolean).join(' ・ ')})]));
    acts.appendChild(h('button',{class:'btn sm',type:'button',text:'編集',onclick:function(){openEditor(key,i)}}));
    acts.appendChild(h('button',{class:'btn sm danger',type:'button',text:'削除',onclick:function(){
      if(!confirm('「'+(w.title||'この'+label)+'」を削除しますか？\n(保存するまでは、サイトには反映されません)'))return;
      arr.splice(i,1);markDirty();rerender();toast('削除しました。保存すると反映されます');
    }}));
    li.appendChild(acts);
  }));
  p.appendChild(h('button',{class:'btn',type:'button',text:'＋ '+label+'を追加',onclick:function(){
    var w={id:newId(key==='works'?'w':'f'),title:'新しい'+label,kind:'',role:'',short:'',text:'',tags:[],en:{}};
    arr.push(w);markDirty();openEditor(key,arr.length-1,true);
  }}));
}
function panelWorks(p){
  p.appendChild(h('h2',{text:'作品'}));
  p.appendChild(h('p',{class:'lead',text:'作品のホイールと短縮版に出る作品です。⠿ をドラッグするか、↑↓で順番を変えられます。幻のカード(迷子のおしらせパレード)は、いつも最後に出ます。'}));
  projectList(p,'works','作品');
}
function panelFuture(p){
  p.appendChild(h('h2',{text:'これからつくりたいもの'}));
  p.appendChild(h('p',{class:'lead',text:'「これから何をつくる？」のホイールに出るものです。'}));
  projectList(p,'future','項目');
}

/* 編集画面 */
var dlg=document.getElementById('dlg'),dlgBody=document.getElementById('dlgBody'),edit=null;
function openEditor(key,i,isNew){
  edit={key:key,i:i,w:clone(data[key][i]),isNew:!!isNew,lang:'ja'};
  document.getElementById('dlgTitle').textContent=(key==='works'?'作品':'これから')+'の編集';
  drawEditor();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
  dlg.scrollTop=0;
}
function closeEditor(){if(dlg.close)dlg.close();else dlg.removeAttribute('open');edit=null}
document.getElementById('dlgCancel').addEventListener('click',function(){
  if(edit&&edit.isNew){data[edit.key].splice(edit.i,1);rerender()}
  closeEditor();
});
dlg.addEventListener('cancel',function(e){e.preventDefault();document.getElementById('dlgCancel').click()});
document.getElementById('dlgOk').addEventListener('click',function(){

/* 画像のどこをズームするか、クリックで決める */
function zoomPicker(src,s){
  if(!s.z)s.z={x:.5,y:.5,s:1};
  var z=s.z;
  var pick=h('div',{class:'zpick',title:'ズームしたい場所をクリック'},[h('img',{src:src,alt:''})]);
  var dot=h('span',{class:'zdot'});pick.appendChild(dot);
  var pimg=h('img',{src:src,alt:''}),prev=h('div',{class:'zprev'},[pimg]);
  var rng=h('input',{type:'range',min:'1',max:'3',step:'0.1',value:String(z.s||1)});
  var lab=h('span',{text:''});
  function upd(){
    dot.style.left=(z.x*100)+'%';dot.style.top=(z.y*100)+'%';
    var tx=Math.min(0,Math.max(1-z.s,.5-z.x*z.s)),ty=Math.min(0,Math.max(1-z.s,.5-z.y*z.s));
    pimg.style.transform='translate('+(tx*100)+'%,'+(ty*100)+'%) scale('+z.s+')';
    lab.textContent='ズーム '+Number(z.s).toFixed(1)+'倍';
  }
  pick.addEventListener('click',function(ev){var r=pick.getBoundingClientRect();z.x=Math.round((ev.clientX-r.left)/r.width*100)/100;z.y=Math.round((ev.clientY-r.top)/r.height*100)/100;upd()});
  rng.addEventListener('input',function(){z.s=Number(rng.value);upd()});
  upd();
  return h('div',{class:'zoom'},[pick,prev,h('div',{class:'zctl'},['小さく',rng,'大きく',lab]),h('p',{class:'hint',style:'grid-column:1/-1;margin:0',text:'左の画像でズームしたい場所をクリック。右が実際の見え方です。'})]);
}

var ENGINES=[{id:'parade',name:'迷子のおしらせパレード'}];
function panelGame(p){
  var G=data.game=data.game||clone(DEF.game||{teams:{a:{},b:{}},games:[]});
  G.teams=G.teams||{};G.teams.a=G.teams.a||{};G.teams.b=G.teams.b||{};G.games=G.games||[];
  p.appendChild(h('h2',{text:'B-Play'}));
  p.appendChild(h('p',{class:'lead',text:'入力欄に「play」と打つか、下の「B-Play」ボタンで開くゲームです。見る人は最初に2つのチームのどちらかをえらび、ゲームの点数がそのチームに入ります。'}));

  /* 点数 */
  var sc=h('div',{class:'card'},[h('h3',{text:'今の点数'})]),scBox=h('div',{class:'scores',text:'読みこみ中…'});
  sc.appendChild(scBox);p.appendChild(sc);
  async function act(body,msg){
    try{var r=await fetch('/admin/api/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'});
      if(!r.ok)throw 0;drawScores(await r.json());toast(msg)}catch(e){toast('できませんでした',true)}
  }
  function tn(t){return (G.teams[t]&&G.teams[t].ja)||('チーム'+t.toUpperCase())}
  function drawScores(s){
    scBox.innerHTML='';
    var tot=h('div',{class:'sc-tot'});
    ['a','b'].forEach(function(t){
      var col=h('div',{class:'sc-team'},[h('span',{text:tn(t)}),h('b',{text:String((s.total&&s.total[t])||0)})]);
      var d=h('input',{type:'number',value:'',placeholder:'+10 / -10'});
      col.appendChild(h('div',{class:'sc-adj'},[d,h('button',{class:'btn sm',type:'button',text:'足す',onclick:function(){var v=Math.round(Number(d.value));if(!v)return;act({action:'adjust',team:t,delta:v},'点数を直しました')}})]));
      tot.appendChild(col);
    });
    scBox.appendChild(tot);
    var ids=Object.keys(s.games||{});
    ids.forEach(function(id){
      var g=G.games.find(function(x){return x.id===id}),nm=g&&g.title&&g.title.ja||id,v=s.games[id]||{};
      scBox.appendChild(h('div',{class:'sc-row'},[h('span',{text:nm}),h('span',{class:'mono',text:tn('a')+' '+(v.a||0)+' ・ '+tn('b')+' '+(v.b||0)}),
        h('button',{class:'btn sm danger',type:'button',text:'このゲームを0に',onclick:function(){if(confirm('「'+nm+'」の点数を0にしますか？(チームの合計からも引かれます)'))act({action:'reset-game',game:id},'0にしました')}})]));
    });
    scBox.appendChild(h('button',{class:'btn sm danger',type:'button',text:'全部の点数を0にする',onclick:function(){if(confirm('両チームの点数を、全部0にしますか？もとにはもどせません。'))act({action:'reset-all'},'全部0にしました')}}));
  }
  fetch('/admin/api/game',{credentials:'same-origin',cache:'no-store'}).then(function(r){return r.json()}).then(drawScores).catch(function(){scBox.textContent='点数を読みこめませんでした'});

  /* チーム */
  var tc=h('div',{class:'card'},[h('h3',{text:'チーム'})]);
  [['a','チーム1'],['b','チーム2']].forEach(function(x){
    var t=G.teams[x[0]];
    var col=h('input',{type:'color',value:t.color||(x[0]==='a'?'#e8743b':'#3b7de8')});col.addEventListener('input',function(){t.color=col.value;markDirty()});
    tc.appendChild(h('div',{class:'two'},[input(x[1]+'の名前(日本語)',t.ja,function(v){t.ja=v}),input(x[1]+'の名前(英語)',t.en,function(v){t.en=v})]));
    tc.appendChild(h('label',{class:'field'},[h('span',{text:x[1]+'の色'}),col]));
  });
  tc.appendChild(h('p',{class:'hint',text:'名前や色を変えても、どちらのチームに入っている人もそのままです。'}));
  p.appendChild(tc);

  /* ゲームの一覧 */
  p.appendChild(h('h3',{text:'ゲームの一覧',style:'margin:24px 0 8px'}));
  p.appendChild(h('p',{class:'hint',text:'⠿ か ↑↓ で並べかえ。「期間限定」は、始まる日から終わる日まで(その日もふくむ)だけ出ます。',style:'margin-bottom:10px'}));
  p.appendChild(sortable(G.games,function(g,i,li,acts){
    var eng=ENGINES.find(function(e){return e.id===(g.engine||g.id)});
    var m=h('div',{class:'meta'},[h('b',{text:(g.title&&g.title.ja)||'(名前なし)'}),h('span',{text:(g.type==='limited'?'期間限定 '+(g.start||'?')+' 〜 '+(g.end||'?'):'常設')+(eng?'':' ・ ゲームの中身がありません')})]);
    var det=h('details',{class:'gdet'},[h('summary',{text:'くわしく編集'})]);
    g.title=g.title||{};g.desc=g.desc||{};
    var sel=h('select',{},[h('option',{value:'permanent',text:'常設(いつでも)'}),h('option',{value:'limited',text:'期間限定'})]);sel.value=g.type==='limited'?'limited':'permanent';
    sel.addEventListener('change',function(){g.type=sel.value;markDirty();rerender()});
    det.appendChild(h('label',{class:'field'},[h('span',{text:'種類'}),sel]));
    if(g.type==='limited')det.appendChild(h('div',{class:'two'},[input('始まる日',g.start,function(v){g.start=v},{type:'date'}),input('終わる日',g.end,function(v){g.end=v},{type:'date'})]));
    det.appendChild(h('div',{class:'two'},[input('名前(日本語)',g.title.ja,function(v){g.title.ja=v}),input('名前(英語)',g.title.en,function(v){g.title.en=v})]));
    det.appendChild(input('説明(日本語)',g.desc.ja,function(v){g.desc.ja=v},{multi:true,rows:2}));
    det.appendChild(input('説明(英語)',g.desc.en,function(v){g.desc.en=v},{multi:true,rows:2}));
    det.appendChild(input('1回でもらえる点数の上限',g.max,function(v){g.max=Number(v)||300},{type:'number',hint:'ズルを防ぐため、これより大きい点数は、この数にけずられます。'}));
    m.appendChild(det);
    li.appendChild(m);
    acts.insertBefore(check(' 出す',g.show!==false,function(v){g.show=v;li.classList.toggle('off',!v)}),acts.firstChild);
    acts.appendChild(h('button',{class:'btn sm danger',type:'button',text:'削除',onclick:function(){if(!confirm('このゲームを一覧から消しますか？(点数は残ります)'))return;G.games.splice(i,1);markDirty();rerender()}}));
    li.appendChild(acts);
  },{isOff:function(g){return g.show===false}}));
  var free=ENGINES.filter(function(e){return !G.games.some(function(g){return (g.engine||g.id)===e.id})});
  if(free.length){
    var ss=h('select',{},free.map(function(e){return h('option',{value:e.id,text:e.name})}));
    p.appendChild(h('div',{class:'addg'},[ss,h('button',{class:'btn',type:'button',text:'＋ ゲームを追加',onclick:function(){var e=ENGINES.find(function(x){return x.id===ss.value});G.games.push({id:e.id,type:'permanent',show:true,start:'',end:'',max:300,title:{ja:e.name,en:''},desc:{ja:'',en:''}});markDirty();rerender()}})]));
  }else p.appendChild(h('p',{class:'hint',text:'今あるゲームは、全部一覧に入っています。新しいゲームの中身ができると、ここから追加できるようになります。'}));

/* オープニングの絵の大きさ(パソコン・スマホ)と、見え方のお試し */
function sizeControls(it){
  var box=h('div',{class:'sizes'});
  function one(label,key,min,def,frameCls){
    var val=Number(it[key])||def;
    var frame=h('div',{class:'frame '+frameCls}),img=h('img',{src:it.image||'/img/park.webp',alt:''});frame.appendChild(img);
    var out=h('b',{text:val+'%'});
    var r=h('input',{type:'range',min:String(min),max:'100',step:'5',value:String(val)});
    function upd(){out.textContent=r.value+'%';img.style.width=r.value+'%';if(frameCls==='pc')img.style.height=r.value+'%'}
    r.addEventListener('input',function(){it[key]=Number(r.value);upd();markDirty()});
    upd();
    return h('div',{class:'size'},[h('div',{class:'size-head'},[h('span',{text:label}),out]),r,frame]);
  }
  box.appendChild(one('パソコンでの大きさ','sizePc',30,60,'pc'));
  box.appendChild(one('スマホでの大きさ','sizeSp',40,100,'sp'));
  return h('div',{class:'field'},[h('span',{text:'絵の大きさ'}),box,h('p',{class:'hint',text:'画面に対して、絵をどれくらいの大きさで出すかです。下の枠が、だいたいの見え方です。'})]);
}

var ANS=[['home','住んでいるところ','どこに住んでる？'],['school','学校','学校はどこ？'],['univ','大学','大学はどこ？'],['nickname','ニックネーム','ビーバーって何？'],['hobby','趣味','趣味は？'],['personality','性格','どんな性格？'],['food','好きな食べ物','好きな食べ物は？'],['english','英語','英語話せる？'],['music','音楽','ピアノは何年？'],['park','好きなテーマパーク','好きなテーマパークは？'],['ride','好きなアトラクション','好きなアトラクションは？'],['show','好きなショー','好きなショーは？'],['career','働きたいところ','将来どこで働きたい？'],['ent','好きなエンタメ','どんなエンタメが好き？'],['immersive','イマーシブとは','イマーシブって何？'],['how','つくりかた','どうやって作ってる？'],['team','1人かチームか','1人で作ってる？'],['idea','アイデア','アイデアはどこから？'],['value','大事にしていること','大事にしていることは？'],['site','このサイトについて','このサイトについて'],['job','仕事の依頼','仕事をお願いできる？(連絡ボタンが自動で出ます)'],['web','ホームページ制作','ホームページ作れる？(連絡ボタンが自動で出ます)'],['collab','一緒につくりたい','一緒に何か作りたい(連絡ボタンが自動で出ます)']];
function panelAnswers(p){
  var A=data.answers=data.answers||{};
  p.appendChild(h('h2',{text:'質問の答え'}));
  p.appendChild(h('p',{class:'lead',text:'質問されたときの答えです。1行が、1つのふきだしになります。'}));
  ANS.forEach(function(a){
    var v=A[a[0]]=A[a[0]]||{ja:[],en:[]};
    var c=h('details',{class:'card'},[h('summary',{text:a[1]+'  ― 例:「'+a[2]+'」'})]);
    c.appendChild(input('日本語',(v.ja||[]).filter(function(x){return typeof x==='string'}).join('\n'),function(t){v.ja=lines(t)},{multi:true,rows:3}));
    c.appendChild(input('英語',(v.en||[]).filter(function(x){return typeof x==='string'}).join('\n'),function(t){v.en=lines(t)},{multi:true,rows:3}));
    p.appendChild(c);
  });
}

/* ---------- プロフィール ---------- */
function rowsEditor(title,arr){
  var c=h('div',{class:'card'},[h('h3',{text:title})]),box=h('div',{class:'rows'});
  function draw(){
    box.innerHTML='';
    arr.forEach(function(r,i){
      var a=h('input',{type:'text',value:r[0]||'',placeholder:'項目'}),b=h('input',{type:'text',value:r[1]||'',placeholder:'内容'});
      a.addEventListener('input',function(){r[0]=a.value;markDirty()});b.addEventListener('input',function(){r[1]=b.value;markDirty()});
      box.appendChild(h('div',{class:'rowed'},[a,b,
        h('button',{class:'mv',type:'button','aria-label':'上へ',text:'↑',disabled:i===0,onclick:function(){move(arr,i,-1);markDirty();draw()}}),
        h('button',{class:'mv',type:'button','aria-label':'下へ',text:'↓',disabled:i===arr.length-1,onclick:function(){move(arr,i,1);markDirty();draw()}}),
        h('button',{class:'mv',type:'button','aria-label':'削除',text:'×',onclick:function(){arr.splice(i,1);markDirty();draw()}})]));
    });
  }
  draw();
  c.appendChild(box);
  c.appendChild(h('button',{class:'btn sm',type:'button',text:'＋ 行を追加',onclick:function(){arr.push(['','']);markDirty();draw()}}));
  return c;
}
function panelProfile(p){
  var ab=data.about=data.about||{ja:[],en:[]},pr=data.profile=data.profile||{ja:[],en:[]},sk=data.skills=data.skills||{ja:[],en:[],lead:{ja:[],en:[]}};
  sk.lead=sk.lead||{ja:[],en:[]};
  p.appendChild(h('h2',{text:'プロフィール'}));
  p.appendChild(h('p',{class:'lead',text:'「どんな人？」「何ができる？」で出る内容です。'}));
  var c=h('div',{class:'card'},[h('h3',{text:'どんな人？'})]);
  c.appendChild(imageField('写真',ab.photo,function(v){ab.photo=v}));
  c.appendChild(input('説明(日本語・1行が1つのふきだし)',(ab.ja||[]).join('\n'),function(t){ab.ja=lines(t)},{multi:true}));
  c.appendChild(input('説明(英語)',(ab.en||[]).join('\n'),function(t){ab.en=lines(t)},{multi:true}));
  p.appendChild(c);
  p.appendChild(rowsEditor('プロフィールの表(日本語)',pr.ja=pr.ja||[]));
  p.appendChild(rowsEditor('プロフィールの表(英語)',pr.en=pr.en||[]));
  var c2=h('div',{class:'card'},[h('h3',{text:'何ができる？'})]);
  c2.appendChild(input('はじめの一言(日本語)',(sk.lead.ja||[]).join('\n'),function(t){sk.lead.ja=lines(t)}));
  c2.appendChild(input('はじめの一言(英語)',(sk.lead.en||[]).join('\n'),function(t){sk.lead.en=lines(t)}));
  p.appendChild(c2);
  p.appendChild(rowsEditor('できることの表(日本語)',sk.ja=sk.ja||[]));
  p.appendChild(rowsEditor('できることの表(英語)',sk.en=sk.en||[]));
  var c3=h('div',{class:'card'},[h('h3',{text:'もしものとき'})]);
  c3.appendChild(h('p',{class:'hint',text:'保存したあとで「やっぱり前のほうがよかった」ときは、1つ前に保存した内容を読みこめます。読みこんだあと「保存する」を押すと、もとにもどります。'}));
  c3.appendChild(h('button',{class:'btn sm',type:'button',text:'1つ前の保存を読みこむ',onclick:async function(){
    if(dirty&&!confirm('保存していない変更は消えます。いいですか？'))return;
    try{var r=await fetch('/admin/api/content?version=prev',{credentials:'same-origin',cache:'no-store'});var j=await r.json();
      if(!j.content){toast('1つ前の保存はまだありません',true);return}
      data=fill(j.content);markDirty();rerender();toast('1つ前の内容を読みこみました。「保存する」で戻せます');
    }catch(e){toast('読みこめませんでした',true)}
  }}));
  p.appendChild(c3);
}

/* ---------- 保存 ---------- */
saveBtn.addEventListener('click',async function(){
  saveBtn.disabled=true;stateEl.textContent='保存中…';
  try{
    var r=await fetch('/admin/api/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'});
    var j=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(j.error||('保存できませんでした('+r.status+')'));
    markClean('保存しました');toast('保存しました。サイトに反映されています');
  }catch(e){saveBtn.disabled=false;stateEl.textContent='保存できませんでした';toast(e.message,true)}
});
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- 読みこみ ---------- */
var DEF=null;
function fill(c){var o={};for(var k in DEF)o[k]=DEF[k];for(var k2 in c)o[k2]=c[k2];return clone(o)}
(async function(){
  try{
    var page=await (await fetch('/',{cache:'no-store'})).text();
    var d=new DOMParser().parseFromString(page,'text/html').getElementById('default-content');
    DEF=JSON.parse(d.textContent);
    var r=await fetch('/admin/api/content',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok)throw new Error('読みこめませんでした('+r.status+')');
    var j=await r.json();
    data=fill(j.content||DEF);
    markClean(j.content?'保存済み':'まだ一度も保存していません(最初の内容を表示中)');
    drawTabs();rerender();
  }catch(e){main.innerHTML='';main.appendChild(h('p',{class:'loading',text:e.message}))}
})();
})();
